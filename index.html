<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#f5f2ea"/>
  <title>Semester Vocabulary</title>
  <style>

:root{--bg:#f5f2ea;--card:#fffdf8;--ink:#20211f;--muted:#7a7b75;--line:#dedbd1;--accent:#20211f;--good:#3d6d57;--bad:#9b5148;--soft:#ebe7dc}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit}.shell{max-width:980px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-size:20px;font-weight:750;letter-spacing:.02em}.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;cursor:pointer}
.hero{margin:35px 0 28px}.hero h1{font-size:clamp(34px,6vw,66px);line-height:1;margin:0 0 12px;letter-spacing:-.04em}.hero p{color:var(--muted);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.course,.week,.mode,.bookcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;cursor:pointer;transition:.15s}.course:hover,.week:hover,.mode:hover,.bookcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0000000c}.course h2,.week h3{margin:0 0 8px}.meta{color:var(--muted);font-size:14px}.bar{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;background:var(--ink)}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:22px 0 16px}.section-title h1{margin:0;font-size:34px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.pill{border:1px solid var(--line);background:var(--card);padding:10px 15px;border-radius:999px;cursor:pointer}.pill.active{background:var(--ink);color:white}
.study{max-width:700px;margin:35px auto}.progress{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin-bottom:16px}.progress .bar{flex:1;margin:0}
.card{min-height:410px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:42px 34px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 12px 40px #00000008}.word{font-size:clamp(38px,8vw,70px);font-weight:760;letter-spacing:-.035em}.tag{margin-top:13px;color:var(--muted)}.meaning{font-size:30px;font-weight:650;margin-top:30px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.btn{border:0;border-radius:18px;padding:18px;cursor:pointer;font-weight:700;background:var(--ink);color:white}.btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--bad)}.btn.good{background:var(--good)}
.options{display:grid;gap:11px;margin-top:28px}.option{border:1px solid var(--line);background:white;border-radius:16px;padding:16px;text-align:left;cursor:pointer}.option.correct{border-color:var(--good);background:#edf4ef}.option.wrong{border-color:var(--bad);background:#f8ecea}
.done{text-align:center;padding:80px 20px}.done h1{font-size:44px}.stats{display:flex;justify-content:center;gap:25px;color:var(--muted);margin:20px 0 30px}.small-actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:55px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:22px}
@media(max-width:600px){.shell{padding:20px 14px 55px}.card{min-height:360px;padding:30px 20px}.actions{grid-template-columns:1fr}.top{margin-bottom:20px}}


.managebox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:13px;font:inherit;color:var(--ink)}
textarea{min-height:180px;resize:vertical}.full{grid-column:1/-1}.manage-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.wordrow{display:grid;grid-template-columns:1.2fr 1.2fr .65fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.wordrow:last-child{border-bottom:0}.danger-mini{border:1px solid #e5c8c4;background:#fff5f3;color:var(--bad);border-radius:12px;padding:8px 10px;cursor:pointer}
.notice{padding:11px 13px;border-radius:13px;background:#edf4ef;color:var(--good);margin-top:12px;display:none}
@media(max-width:650px){.formgrid{grid-template-columns:1fr}.wordrow{grid-template-columns:1fr}.full{grid-column:auto}}


.cloudbadge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;color:var(--muted);background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%;background:#999}.dot.ok{background:#3d6d57}.dot.err{background:#9b5148}
.cloudpanel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:0 0 18px}
.codeinput{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}

</style>
</head>
<body>
<div id="fatal" style="display:none;max-width:760px;margin:40px auto;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<h2>页面加载出现问题</h2><p id="fatalmsg"></p></div>
<script>
window.addEventListener('error', function(e){
  var f=document.getElementById('fatal'); if(f){f.style.display='block';}
  var m=document.getElementById('fatalmsg'); if(m){m.textContent=e.message || '未知错误';}
});
</script>
<div id="app"></div>
<script>

const COURSES = {
  COM5101:{name:"COM5101", subtitle:"Communication Fundamental"},
  COM5103:{name:"COM5103", subtitle:"Policy and Regulations of New Media"},
  COM5104:{name:"COM5104", subtitle:"Research Methods for Communication and New Media"},
  COM5501:{name:"COM5501", subtitle:"Internet Communication"}
};
const BASE_WORDS = [];
let customWords = JSON.parse(localStorage.getItem("customWords") || "[]");
let WORDS = [...BASE_WORDS, ...customWords];
const saveWords=()=>localStorage.setItem("customWords", JSON.stringify(customWords));


const SUPABASE_URL="https://lgluwowzuwsabedbyblr.supabase.co";
const SUPABASE_KEY="sb_publishable_04dsccL9acJYdCafv99nYg_yRgMaQdB";
const CLOUD_ID_KEY="vocabCloudId";
let cloudId=localStorage.getItem(CLOUD_ID_KEY)||"";
let cloudOnline=false;
async function sb(path, options={}){
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path, {
    ...options,
    headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":options.prefer||"",...(options.headers||{})}
  });
  if(!r.ok) throw new Error(await r.text());
  let text=await r.text(); return text?JSON.parse(text):null;
}
function newCloudId(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return "user-"+Date.now()+"-"+Math.random().toString(36).slice(2);
}
function setCloudId(id){cloudId=id.trim();localStorage.setItem(CLOUD_ID_KEY,cloudId)}
async function ensureCloudId(){
  if(!cloudId) setCloudId(newCloudId());
  return cloudId;
}
async function cloudLoad(){
  await ensureCloudId();
  try{
    let rows=await sb("vocabulary_data?device_user=eq."+encodeURIComponent(cloudId)+"&select=*");
    let cloudCustom=[], known=[], unknown=[], wrong={}, seen={};
    (rows||[]).forEach(r=>{
      let wid=1000000+Number(r.id);
      cloudCustom.push({id:wid,cloudRowId:r.id,course:r.course,week:r.week,en:r.english,zh:r.chinese,type:r.word_type||"Professional term"});
      if(r.status==="known") known.push(wid); else if(r.status==="unknown") unknown.push(wid);
      wrong[wid]=r.wrong_count||0;seen[wid]=r.seen_count||0;
    });
    customWords=cloudCustom; WORDS=[...BASE_WORDS,...customWords];
    // Built-in words remain local; user-added words are cloud-synced.
    let localKnown=state.known.filter(id=>id<1000000), localUnknown=state.unknown.filter(id=>id<1000000);
    state.known=[...localKnown,...known];state.unknown=[...localUnknown,...unknown];
    Object.assign(state.wrong,wrong);Object.assign(state.seen,seen);
    saveWords();save();cloudOnline=true;return true;
  }catch(e){console.error(e);cloudOnline=false;return false}
}
async function cloudInsert(item){
  await ensureCloudId();
  let rows=await sb("vocabulary_data",{method:"POST",prefer:"return=representation",body:JSON.stringify({
    device_user:cloudId,course:item.course,week:item.week,english:item.en,chinese:item.zh,word_type:item.type,status:"new",wrong_count:0,seen_count:0
  })});
  return rows&&rows[0];
}
async function cloudPatchWord(w){
  if(!w.cloudRowId)return;
  let status=state.known.includes(w.id)?"known":state.unknown.includes(w.id)?"unknown":"new";
  await sb("vocabulary_data?id=eq."+w.cloudRowId,{method:"PATCH",body:JSON.stringify({status,wrong_count:state.wrong[w.id]||0,seen_count:state.seen[w.id]||0})});
}
async function cloudDelete(w){
  if(w.cloudRowId) await sb("vocabulary_data?id=eq."+w.cloudRowId,{method:"DELETE"});
}

let state = JSON.parse(localStorage.getItem("vocabState")||'{"known":[],"unknown":[],"wrong":{},"seen":{}}');
let route={page:"home"}, session=null;
const save=()=>localStorage.setItem("vocabState",JSON.stringify(state));
const app=document.querySelector("#app");
new MutationObserver(()=>setTimeout(updateCloudBadge,0)).observe(app,{childList:true,subtree:true});
const weeks=Array.from({length:13},(_,i)=>i+1);

function header(back){
 return `<div class="top"><div class="brand">Semester Vocabulary</div><div class="small-actions">${back?`<button class="ghost" onclick="goBack()">← 返回</button>`:""}<span class="cloudbadge"><i id="clouddot" class="dot"></i><span id="cloudtxt">云端</span></span><button class="ghost" onclick="syncNow()">同步</button><button class="ghost" onclick="manageWords()">词库管理</button><button class="ghost" onclick="books()">生词本 / 熟词本</button></div></div>`;
}
function progressFor(course){
 let ws=WORDS.filter(w=>w.course===course), done=ws.filter(w=>state.known.includes(w.id)).length;
 return [done,ws.length,ws.length?Math.round(done/ws.length*100):0];
}
function home(){
 route={page:"home"};
 let cards=Object.values(COURSES).map(c=>{let [d,t,p]=progressFor(c.name);return `<div class="course" onclick="course('${c.name}')"><div class="meta">${c.subtitle}</div><h2>${c.name}</h2><div class="meta">${t?t+" 个词汇已录入":"等待录入词汇"} · 熟词 ${d}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("");
 app.innerHTML=`<div class="shell">${header(false)}<div class="hero"><h1>把专业词汇<br>真正记下来。</h1><p>按课程、Week 学习。快速过词、四选一测试，并自动整理生词与熟词。</p></div><div class="grid">${cards}</div></div>`;
}
function course(c){
 route={page:"course",course:c};
 let cards=weeks.map(w=>{let arr=WORDS.filter(x=>x.course===c&&x.week===w);let done=arr.filter(x=>state.known.includes(x.id)).length;let p=arr.length?done/arr.length*100:0;return `<div class="week" onclick="${arr.length?`week('${c}',${w})`:""}"><h3>Week ${w}</h3><div class="meta">${arr.length?`${arr.length} 个词 · 熟词 ${done}`:"尚未录入"}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("");
 app.innerHTML=`<div class="shell">${header(true)}<div class="section-title"><div><div class="meta">${COURSES[c].subtitle}</div><h1>${c}</h1></div></div><div class="grid">${cards}</div></div>`;
}
function week(c,w){
 route={page:"week",course:c,week:w};
 let n=WORDS.filter(x=>x.course===c&&x.week===w).length;
 app.innerHTML=`<div class="shell">${header(true)}<div class="section-title"><div><div class="meta">${c}</div><h1>Week ${w}</h1><div class="meta">${n} 个词汇</div></div></div><div class="grid"><div class="mode" onclick="start('${c}',${w},'recognize')"><h2>快速过词</h2><p class="meta">英文 → 认识 / 不认识 → 核对中文 → 我错了 / 我没错</p></div><div class="mode" onclick="start('${c}',${w},'quiz')"><h2>四选一</h2><p class="meta">显示英文，从四个中文释义中选择正确答案。</p></div></div></div>`;
}
function start(c,w,mode,custom=null){
 let words=custom||WORDS.filter(x=>x.course===c&&x.week===w);
 session={c,w,mode,words:[...words].sort(()=>Math.random()-.5),i:0,phase:"ask",score:0};
 renderStudy();
}
function renderStudy(){
 let s=session, x=s.words[s.i];
 if(!x){return finish()}
 let pct=Math.round(s.i/s.words.length*100);
 let body="";
 if(s.mode==="recognize"){
   body=`<div class="card"><div class="word">${x.en}</div><div class="tag">${x.type} · ${x.course} · Week ${x.week}</div>${s.phase==="reveal"?`<div class="meaning">${x.zh}</div>`:""}</div>`;
   if(s.phase==="ask") body+=`<div class="actions"><button class="btn bad" onclick="dontKnow()">不认识</button><button class="btn" onclick="know()">认识</button></div>`;
   else body+=`<div class="actions"><button class="btn bad" onclick="verify(false)">我错了</button><button class="btn good" onclick="verify(true)">我没错</button></div>`;
 } else {
   if(!s.opts) s.opts=makeOptions(x);
   body=`<div class="card"><div class="word">${x.en}</div><div class="tag">${x.type} · ${x.course} · Week ${x.week}</div><div class="options">${s.opts.map((o,i)=>`<button id="op${i}" class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div></div>`;
 }
 app.innerHTML=`<div class="shell"><div class="study"><div class="progress"><span>${s.i+1} / ${s.words.length}</span><div class="bar"><i style="width:${pct}%"></i></div><button class="ghost" onclick="week('${s.c}',${s.w})">退出</button></div>${body}</div></div>`;
}
function know(){session.phase="reveal";renderStudy()}
function dontKnow(){let x=session.words[session.i];if(!state.unknown.includes(x.id))state.unknown.push(x.id);state.known=state.known.filter(id=>id!==x.id);state.seen[x.id]=(state.seen[x.id]||0)+1;save();next()}
function verify(ok){let x=session.words[session.i];state.seen[x.id]=(state.seen[x.id]||0)+1;if(ok){if(!state.known.includes(x.id))state.known.push(x.id);state.unknown=state.unknown.filter(id=>id!==x.id);session.score++}else{if(!state.unknown.includes(x.id))state.unknown.push(x.id);state.known=state.known.filter(id=>id!==x.id);state.wrong[x.id]=(state.wrong[x.id]||0)+1}save();next()}
function makeOptions(x){
 let pool=WORDS.filter(w=>w.id!==x.id).map(w=>w.zh).filter((v,i,a)=>a.indexOf(v)===i).sort(()=>Math.random()-.5).slice(0,3);
 return [...pool,x.zh].sort(()=>Math.random()-.5);
}
function answer(i){
 let s=session,x=s.words[s.i], correct=s.opts[i]===x.zh;
 document.querySelectorAll(".option").forEach((b,j)=>{b.disabled=true;if(s.opts[j]===x.zh)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});
 state.seen[x.id]=(state.seen[x.id]||0)+1;
 if(correct){s.score++;if(!state.known.includes(x.id))state.known.push(x.id);state.unknown=state.unknown.filter(id=>id!==x.id)}
 else{if(!state.unknown.includes(x.id))state.unknown.push(x.id);state.known=state.known.filter(id=>id!==x.id);state.wrong[x.id]=(state.wrong[x.id]||0)+1}
 save();cloudPatchWord(x).catch(console.error);setTimeout(next,850);
}
function next(){session.i++;session.phase="ask";session.opts=null;renderStudy()}
function finish(){
 let s=session;
 app.innerHTML=`<div class="shell">${header(false)}<div class="done"><div class="meta">${s.c} · Week ${s.w}</div><h1>这一轮完成了。</h1><div class="stats"><span>共 ${s.words.length} 词</span><span>确认掌握 ${s.score}</span></div><button class="btn" onclick="week('${s.c}',${s.w})">返回 Week ${s.w}</button></div></div>`;
}
function books(){
 route={page:"books"};
 let unknown=WORDS.filter(w=>state.unknown.includes(w.id)), known=WORDS.filter(w=>state.known.includes(w.id));
 app.innerHTML=`<div class="shell">${header(true)}<div class="section-title"><h1>词汇本</h1></div><div class="tabs"><button class="pill active" onclick="showBook('unknown',this)">生词 ${unknown.length}</button><button class="pill" onclick="showBook('known',this)">熟词 ${known.length}</button></div><div id="book"></div></div>`;
 showBook("unknown");
}
function showBook(type,el){
 if(el){document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));el.classList.add("active")}
 let ids=type==="unknown"?state.unknown:state.known, arr=WORDS.filter(w=>ids.includes(w.id));
 let b=document.querySelector("#book"); if(!arr.length){b.innerHTML=`<div class="empty">${type==="unknown"?"目前没有生词。":"目前还没有熟词。"}</div>`;return}
 b.innerHTML=`<div class="grid">${arr.map(w=>`<div class="bookcard"><div class="meta">${w.course} · Week ${w.week} · ${w.type}</div><h2>${w.en}</h2><div>${w.zh}</div><div class="meta" style="margin-top:10px">答错 ${state.wrong[w.id]||0} 次</div></div>`).join("")}</div>`;
}

async function syncNow(){
 let ok=await cloudLoad();updateCloudBadge(); if(route.page==="home")home(); else if(route.page==="course")course(route.course); else if(route.page==="week")week(route.course,route.week); else if(route.page==="books")books(); else if(route.page==="manage")manageWords();
}
function updateCloudBadge(){let d=document.getElementById("clouddot"),t=document.getElementById("cloudtxt");if(d)d.className="dot "+(cloudOnline?"ok":"err");if(t)t.textContent=cloudOnline?"已同步":"未同步"}
function copyCloudCode(){navigator.clipboard.writeText(cloudId).then(()=>alert("同步码已复制"))}
async function useCloudCode(){let id=prompt("粘贴你另一台设备上的同步码：");if(!id)return;setCloudId(id);await syncNow()}
function manageWords(){
 route={page:"manage"};
 let courseOpts=Object.keys(COURSES).map(c=>`<option value="${c}">${c}</option>`).join("");
 let weekOpts=weeks.map(w=>`<option value="${w}">Week ${w}</option>`).join("");
 app.innerHTML=`<div class="shell">${header(true)}
 <div class="section-title"><div><div class="meta">Add · Import · Edit · Cloud</div><h1>词库管理</h1></div></div>
 <div class="cloudpanel"><h2>跨设备同步码</h2><p class="meta">在其他设备打开同一网站后，把这里的同步码复制过去，就会读取同一份云端词库。不要公开分享这个同步码。</p>
 <div class="formgrid"><div class="field full"><label>我的同步码</label><input class="codeinput" id="cloudCode" value="${cloudId}" readonly></div></div>
 <div class="manage-actions"><button class="btn secondary" onclick="copyCloudCode()">复制同步码</button><button class="btn secondary" onclick="useCloudCode()">在这台设备输入已有同步码</button></div></div>
 <div class="managebox">
   <h2>添加一个单词</h2>
   <div class="formgrid">
    <div class="field"><label>课程</label><select id="mc">${courseOpts}</select></div>
    <div class="field"><label>Week</label><select id="mw">${weekOpts}</select></div>
    <div class="field"><label>英文</label><input id="men" placeholder="e.g. privacy"></div>
    <div class="field"><label>中文</label><input id="mzh" placeholder="例如：隐私"></div>
    <div class="field full"><label>类型</label><select id="mtype"><option>Professional term</option><option>Legal term</option><option>Theory</option><option>Research term</option><option>Difficult word</option><option>Key term</option></select></div>
   </div>
   <div class="manage-actions"><button class="btn" onclick="addOne()">添加单词</button></div><div id="notice1" class="notice"></div>
 </div>
 <div class="managebox">
   <h2>批量导入</h2>
   <p class="meta">先选择课程和 Week。每行一个词，支持「英文[TAB]中文」或「英文 | 中文」。</p>
   <div class="formgrid">
    <div class="field"><label>课程</label><select id="bc">${courseOpts}</select></div>
    <div class="field"><label>Week</label><select id="bw">${weekOpts}</select></div>
    <div class="field full"><label>词表</label><textarea id="bulk" placeholder="privacy    隐私&#10;consent    同意&#10;personal data | 个人数据"></textarea></div>
   </div>
   <div class="manage-actions"><button class="btn" onclick="bulkImport()">批量导入</button><button class="btn secondary" onclick="exportWords()">导出自定义词库</button></div><div id="notice2" class="notice"></div>
 </div>
 <div class="managebox"><h2>我添加的词</h2><div id="customList"></div></div>
 </div>`;
 renderCustomList();
}
function freshWords(){WORDS=[...BASE_WORDS,...customWords]}
function nextCustomId(){
 let ids=WORDS.map(w=>Number(w.id)||0); return Math.max(1000,...ids)+1;
}
function showNotice(id,msg){let n=document.getElementById(id);n.textContent=msg;n.style.display="block";setTimeout(()=>n.style.display="none",2500)}
async function addOne(){
 let course=document.getElementById("mc").value, week=Number(document.getElementById("mw").value),
 en=document.getElementById("men").value.trim(), zh=document.getElementById("mzh").value.trim(), type=document.getElementById("mtype").value;
 if(!en||!zh){showNotice("notice1","请同时填写英文和中文。");return}
 try{
   let row=await cloudInsert({course,week,en,zh,type});
   let item={id:1000000+Number(row.id),cloudRowId:row.id,course,week,en,zh,type};
   customWords.push(item);saveWords();freshWords();
   document.getElementById("men").value="";document.getElementById("mzh").value="";showNotice("notice1","已保存到云端："+en);renderCustomList();
 }catch(e){showNotice("notice1","云端保存失败，请检查网络。");}
}
async function bulkImport() {
  const course = document.getElementById("bc").value;
  const week = Number(document.getElementById("bw").value);
  const raw = document.getElementById("bulk").value.trim();

  if (!raw) {
    showNotice("notice2", "请先粘贴词表。");
    return;
  }

  const items = [];

  const lines = raw.split(/\r?\n/);

  for (const line of lines) {
    const cleanLine = line.trim();
    if (!cleanLine) continue;

    let parts;

    if (cleanLine.includes("\t")) {
      parts = cleanLine.split("\t");
    } else if (cleanLine.includes("|")) {
      parts = cleanLine.split("|");
    } else {
      const match = cleanLine.match(/^(.+?)\s{2,}(.+)$/);
      if (match) {
        parts = [match[1], match[2]];
      } else {
        continue;
      }
    }

    if (parts.length >= 2) {
      const en = parts[0].trim();
      const zh = parts.slice(1).join(" ").trim();

      if (en && zh) {
        items.push({
          course,
          week,
          en,
          zh,
          type: "Professional term"
        });
      }
    }
  }

  if (items.length === 0) {
    showNotice(
      "notice2",
      "没有识别到词汇。请使用：英文[TAB]中文 或 英文 | 中文"
    );
    return;
  }

  let count = 0;
  let failed = 0;

  for (const item of items) {
    try {
      const row = await cloudInsert(item);

      customWords.push({
        id: 1000000 + Number(row.id),
        cloudRowId: row.id,
        ...item
      });

      count++;
    } catch (e) {
      console.error("Import failed:", item, e);
      failed++;
    }
  }

  saveWords();
  freshWords();
  renderCustomList();

  document.getElementById("bulk").value = "";

  if (failed === 0) {
    showNotice(
      "notice2",
      `成功保存 ${count} 个词到云端。`
    );
  } else {
    showNotice(
      "notice2",
      `成功 ${count} 个，失败 ${failed} 个。`
    );
  }
}
function exportWords(){
 let data=JSON.stringify(customWords,null,2), blob=new Blob([data],{type:"application/json;charset=utf-8"}), a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="my-vocabulary-backup.json";a.click();URL.revokeObjectURL(a.href);
}
