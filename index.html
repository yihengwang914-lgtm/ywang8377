<style>
:root{--bg:#f5f2e8;--ink:#22221f;--muted:#77756e;--line:#ddd8cc;--card:#fbfaf6;--dark:#232320;--red:#a95d56;--green:#327d62}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif}
header{max-width:960px;height:84px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 0;background:transparent}
.brand{font-size:18px;font-weight:750;letter-spacing:-.2px}.top{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit}.linkbtn{border:1px solid var(--line);background:rgba(255,255,255,.35);border-radius:999px;padding:9px 14px;cursor:pointer;color:var(--ink);text-decoration:none}.sync{font-weight:500}.sync.off{color:var(--muted)}.sync.on{color:var(--muted)}.sync.off:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:7px}.sync.on:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px}
main{max-width:960px;margin:0 auto;padding:24px 0 70px}.hero{text-align:left;margin:8px 0 28px}.hero h1{font-size:50px;line-height:.98;letter-spacing:-2.4px;margin:0 0 14px;font-weight:850;max-width:540px}.hero p{color:var(--muted);font-size:15px;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.course{min-height:182px;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:24px 22px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:none;transition:.18s ease}.course:hover{transform:translateY(-2px);box-shadow:0 10px 25px #00000008}.code{font-size:13px;color:var(--muted)}.course h2{font-size:22px;margin:4px 0 0;line-height:1.05;letter-spacing:-.5px}.meta{font-size:13px;color:var(--muted)}
.sectionHead{display:flex;align-items:center;gap:18px;margin-bottom:28px}.back{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 13px;cursor:pointer}.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.week{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:22px;cursor:pointer}.week strong{font-size:19px}.week small{display:block;color:var(--muted);margin-top:10px}
.panel{max-width:880px;margin:0 auto;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:28px}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}
.uploadConsent{display:flex;align-items:flex-start;gap:10px}.uploadConsent input{width:auto;flex:none;margin-top:5px}.back{white-space:nowrap}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:14px inherit}textarea{min-height:180px;resize:vertical}
.primary{background:var(--dark);color:#fff;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}.secondary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 18px;cursor:pointer}
.notice{margin-top:14px;font-size:13px;color:var(--green)}.danger{color:var(--red)}
.list{margin-top:22px;border-top:1px solid var(--line)}.item{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #e6e1d8;font-size:14px}.item .zh{color:var(--muted)}
.study{text-align:center;max-width:760px;margin:0 auto}.word{font-size:46px;margin:70px 0 40px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}.bigBtns{display:flex;gap:18px;justify-content:center}.bigBtns button{min-width:160px;padding:16px}.answer{font-size:24px;margin:24px 0}.tabs{display:flex;gap:10px;margin-bottom:18px}.tabs button.active{background:var(--dark);color:#fff}.empty{text-align:center;color:var(--muted);padding:60px 0}
.signature{text-align:center;color:#8a877f;font-size:12px;margin-top:46px;letter-spacing:.2px}
.uploadHome{margin-top:22px;padding:22px 24px;border:1px solid var(--line);border-radius:22px;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:20px}.uploadHome h2{font-size:20px;margin:0 0 8px}.uploadHome p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.uploadPanel label{display:block;font-size:14px;margin-bottom:8px}.uploadFields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.uploadFile{margin:24px 0;border:1px dashed #bcb5a7;border-radius:16px;padding:22px;background:#fff}.uploadFile input{border:0;padding:10px 0}.uploadHint{font-size:13px;color:var(--muted);line-height:1.7;margin:8px 0 0}.uploadStatus{line-height:1.7;margin-top:20px;font-size:14px;overflow-wrap:anywhere}.uploadStatus:empty{display:none}.uploadStatus.error{color:var(--red)}.uploadStatus.success{color:var(--green)}.uploadResults{margin-top:24px}.uploadResults details{border-bottom:1px solid var(--line);padding:13px 0}.uploadResults summary{cursor:pointer;font-size:15px}.uploadResults .zh{display:block;margin-top:6px;color:var(--muted);font-size:14px}.uploadResults blockquote{margin:12px 0;padding:8px 12px;border-left:2px solid var(--line);font-size:13px;color:var(--muted);overflow-wrap:anywhere}.uploadResults h3{margin-top:0}.uploadActions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}button:disabled{opacity:.5;cursor:wait}.uploadProgress{display:flex;gap:10px;align-items:center}.uploadSpinner{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:uploadSpin 1s linear infinite}@keyframes uploadSpin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.uploadSpinner{animation:none}}@media(max-width:560px){.uploadHome{align-items:flex-start;flex-direction:column}.uploadFields{grid-template-columns:1fr}.uploadPanel{padding:20px}.uploadHome .primary{width:100%}}
@media(max-width:1000px){header,main{max-width:none;margin-left:5vw;margin-right:5vw}.grid,.weeks{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid,.weeks,.choices{grid-template-columns:1fr}.top{gap:5px;font-size:11px;flex-wrap:wrap;justify-content:flex-end}.linkbtn{padding:7px 9px}header{height:auto;padding:18px 0;align-items:flex-start}.brand{font-size:16px}.hero h1{font-size:40px}}
[hidden]{display:none!important}.authPanel{max-width:480px}.authPanel label{display:block;margin:18px 0 8px}
.schoolPicker{position:relative}.suggestions{position:absolute;z-index:10;left:0;right:0;top:100%;max-height:230px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #00000014;margin-top:5px;padding:6px}.suggestion{display:block;width:100%;text-align:left;border:0;background:#fff;padding:10px 11px;border-radius:8px;cursor:pointer}.suggestion:hover,.suggestion:focus{background:var(--bg)}.suggestion small{display:block;color:var(--muted);margin-top:3px}
</style>

<body>
<header>
  <a class="brand brandLockup" href="/" onclick="showHome();return false" aria-label="奇点 CourseLex AI 首页"><img src="assets/brand/courselex-mark.png" alt="" width="44" height="44"><span><strong>奇点</strong><small>CourseLex AI</small></span></a>
  <div class="top" id="userNav" hidden>
    <nav class="studyNav" aria-label="学习导航"><button class="active" onclick="navigateStudy('home',this)">首页</button><button onclick="navigateStudy('manager',this)">资料</button><button onclick="navigateStudy('unknown',this)">生词</button><button onclick="navigateStudy('known',this)">熟词</button></nav>
    <button id="syncState" class="sync compactSync off" onclick="syncNow()">未同步</button>
    <details class="navMenu"><summary>账户 <span aria-hidden="true">⌄</span></summary><div class="navPanel" onclick="this.parentElement.open=false">
    <a class="linkbtn" href="courselex-user-guide.pdf?v=4.1" target="_blank" rel="noopener">用户指南</a>
    <button class="linkbtn" onclick="showProfile()">我的资料</button>
    <button class="linkbtn" onclick="logout()">退出</button>
    <a class="linkbtn" id="adminLink" href="admin.html" hidden>管理后台</a>
    </div></details>
  </div>
</header>
<main id="app"></main>
<footer class="signature" style="margin:0;padding:0 0 100px"><button class="linkbtn" onclick="showInstall()">添加到桌面</button><p>奇点 · CourseLex AI<br>从未知出发，向无限探索</p></footer>
<dialog id="installDialog"><h2>添加奇点到桌面</h2><p id="installInstructions"></p><p class="meta">桌面快捷入口使用同一账号与云端进度，使用时需要联网。</p><form method="dialog"><button class="secondary">知道了</button></form></dialog>
<script src="vendor/supabase-2.57.4.js"></script>
<script>
const SUPABASE_URL="https://lgluwowzuwsabedbyblr.supabase.co";
const SUPABASE_KEY="sb_publishable_04dsccL9acJYdCafv99nYg_yRgMaQdB";
const authClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'courselex-auth-v2'}});
let session=null,accountEpoch=0;
let COURSES={},courseRows=[];
function weekCount(c){return courseRows.find(x=>x.id===c)?.weeks||13}
function courseLabel(c){const r=courseRows.find(x=>x.id===c);return r?.code||r?.name||'课程'}
let words=[];
let currentCourse="",currentWeek=1,currentMode="choice",queue=[],qIndex=0,current=null;
let progress={};
let cloudOnline=false,answerBusy=false;
const app=document.getElementById("app");
const syncState=document.getElementById("syncState");

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function recordAnswer(status,selected=null){
 const word=current,epoch=accountEpoch;if(!word||!session||answerBusy)return;answerBusy=true;
 try{const saved=await sb('rpc/answer_courselex_word',{method:'POST',body:JSON.stringify({p_word:word.id,p_known:status==='known'})});
 if(epoch!==accountEpoch)return;Object.assign(word,saved);const cloud=words.find(w=>w.id===word.id);if(cloud)Object.assign(cloud,saved);progress[word.id]=status;answerBusy=false;showAnswerFeedback(status,selected);}
 catch(e){if(epoch===accountEpoch){answerBusy=false;alert('学习进度未保存，请重试：'+e.message)}}
}
function setSync(ok){cloudOnline=ok;syncState.className="sync compactSync "+(ok?"on":"off");syncState.textContent=ok?"已同步":"未同步"}
async function sb(path,opt={}){
 const epoch=accountEpoch;const {data,error}=await authClient.auth.getSession();
 if(error||!data.session||!session||data.session.user.id!==session.user.id)throw new Error('请重新登录');
 const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});
 if(epoch!==accountEpoch)throw new Error('账号已切换');
 if(!r.ok){let e;try{e=await r.json()}catch{}throw new Error(e?.message||'云端请求失败，请稍后重试')}
 const t=await r.text();return t?JSON.parse(t):[];
}
async function loadCloud(){
 if(!session)return false;const epoch=accountEpoch;
 try{
 const courses=await sb('user_courses?select=*&order=created_at.asc');const loaded=[];
 for(let offset=0;;offset+=1000){const batch=await sb('user_vocabulary?select=id,course:course_id,week,en:english,zh:chinese,type:word_type,status,seen_count,wrong_count,last_review_at,next_review_at,review_streak,legacy_id&order=id.asc&limit=1000&offset='+offset);loaded.push(...batch);if(batch.length<1000)break;}
 if(epoch!==accountEpoch)return false;
 courseRows=courses;COURSES=Object.fromEntries(courses.filter(c=>!c.archived).map(c=>[c.id,c.name]));
 words=loaded.filter(w=>Object.hasOwn(COURSES,w.course));progress=Object.fromEntries(words.map(w=>[w.id,w.status]));
 if(!COURSES[currentCourse]){currentCourse=Object.keys(COURSES)[0]||'';currentWeek=1;}currentWeek=Math.min(currentWeek,weekCount(currentCourse));
 setSync(true);return true;
 }catch(e){if(epoch===accountEpoch){setSync(false);console.error(e)}return false;}
}
async function syncNow(){
 if(!session)return showAuth();
 const epoch=accountEpoch;await loadCloud();
 if(epoch===accountEpoch)renderCurrent();
}
function countCourse(c){return words.filter(w=>w.course===c).length}
function setStudyNav(view){const index={home:0,manager:1,unknown:2,known:3}[view];document.querySelectorAll?.('.studyNav button').forEach((b,i)=>b.classList.toggle('active',i===index));}
function navigateStudy(view){if(view==='home')showHome();else if(view==='manager')showMaterialsLibrary();else showBook(view);}
function countWeek(c,w){return words.filter(x=>x.course===c&&Number(x.week)===Number(w)).length}
function knownCount(c){return words.filter(w=>w.course===c&&progress[w.id]==="known").length}

function showHome(){return showAssistant()}

function showWeeks(c){
 currentCourse=c;window._view={type:"weeks",c};
 app.innerHTML=`<div class="sectionHead"><button class="back" onclick="showHome()">← 返回</button><div><div class="code">${esc(courseLabel(c))}</div><h1>${esc(COURSES[c])}</h1></div></div>
 <div class="weeks">${Array.from({length:weekCount(c)},(_,i)=>i+1).map(w=>`<div class="week" onclick="showWeek('${c}',${w})"><strong>Week ${w}</strong><small>${countWeek(c,w)} words</small></div>`).join("")}</div>`;
}
function showWeek(c,w){
 currentCourse=c;currentWeek=w;window._view={type:"week",c,w};
 const n=countWeek(c,w);
 app.innerHTML=`<div class="sectionHead"><button class="back" onclick="showWeeks('${c}')">← 返回</button><div><div class="code">${esc(courseLabel(c))}</div><h1>Week ${w}</h1></div></div>
 <div class="panel"><h2>${n} words</h2><p class="meta">选择学习方式</p><div class="row">
 <button class="secondary" onclick="startStudy('choice')">四选一</button><button class="secondary" onclick="startStudy('recognition')">认识 / 不认识</button>
 <button class="secondary" onclick="showManager('${c}',${w})">管理本周词汇</button></div></div>`;
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function buildDistractors(cur){
 const distractorWords=window.dailyStudy&&typeof ownedStudyWords==='function'?ownedStudyWords():words;
 const used=new Set([cur.zh]);
 const result=[];
 const groups=[
   distractorWords.filter(w=>w.id!==cur.id&&w.course===cur.course&&Number(w.week)===Number(cur.week)),
   distractorWords.filter(w=>w.id!==cur.id&&w.course===cur.course&&Number(w.week)!==Number(cur.week)),
   distractorWords.filter(w=>w.id!==cur.id&&w.course!==cur.course)
 ];
 for(const group of groups){
   for(const w of shuffle(group)){
     const z=String(w.zh||"").trim();
     if(z&&!used.has(z)){used.add(z);result.push(z)}
     if(result.length===3)return result;
   }
 }
 return result;
}
function studyBackButton(){if(window.dailyStudy)return `<div class="sectionHead"><button class="back" onclick="showHome()">← 回到首页</button></div>`;return `<div class="sectionHead"><button class="back" onclick="showWeek(currentCourse,currentWeek)">← 返回上一页</button></div>`}
function startStudy(mode){window.dailyStudy=false;
 currentMode=mode;queue=shuffle(words.filter(x=>x.course===currentCourse&&Number(x.week)===Number(currentWeek)));qIndex=0;
 if(!queue.length){app.innerHTML=`${studyBackButton()}<div class="empty">本周还没有词汇。<br><br><button class="secondary" onclick="showManager('${currentCourse}',${currentWeek})">去导入</button></div>`;return}
 showQuestion();
}
function showQuestion(){document.body?.classList.remove('assistantMode');
 current=queue[qIndex];
 if(!current){if(window.dailyStudy){app.innerHTML=`<section class="study"><h1>这一轮，完成了。</h1><p>学过 ${queue.length} 个词，已根据答题情况安排下次复习。</p><button class="primary" onclick="showHome()">回到首页</button></section>`;window._view={type:'studyComplete'};return}showWeek(currentCourse,currentWeek);return}if(window.dailyStudy){currentCourse=current.course;currentWeek=current.week;}
 if(currentMode==="choice"){
   const distractors=buildDistractors(current);
   if(distractors.length<3){currentMode='recognition';return showQuestion();}

   let opts=shuffle([current.zh,...distractors]);window.answerOptions=opts;
   app.innerHTML=`${studyBackButton()}<div class="study"><div class="code">${esc(courseLabel(currentCourse))} · Week ${currentWeek} · ${qIndex+1}/${queue.length}</div><div class="word">${esc(current.en)}</div><div class="choices">${opts.map(o=>`<button class="choice" onclick="answerChoiceIndex(${opts.indexOf(o)})">${esc(o)}</button>`).join("")}</div></div>`;
 }else{
   app.innerHTML=`${studyBackButton()}<div class="study"><div class="code">${esc(courseLabel(currentCourse))} · Week ${currentWeek} · ${qIndex+1}/${queue.length}</div><div class="word">${esc(current.en)}</div><div class="bigBtns"><button class="secondary" onclick="markUnknown()">不认识</button><button class="primary" onclick="revealKnown()">认识</button></div></div>`;
 }
}
function answerChoiceIndex(i){if(answerBusy||window._view?.type==='feedback')return;const selected=window.answerOptions?.[i];if(selected===undefined)return;return recordAnswer(selected===current.zh?"known":"unknown",selected)}
function showAnswerFeedback(status,selected){
 window._view={type:'feedback'};
 app.innerHTML=`${studyBackButton()}<div class="study feedback"><div class="code">${esc(courseLabel(currentCourse))} · Week ${currentWeek} · ${qIndex+1}/${queue.length}</div><p class="feedbackResult ${status==='known'?'correct':'danger'}">${status==='known'?'答对了':'再记一次'}</p><div class="word">${esc(current.en)}</div><section class="panel"><div class="meta">正确答案</div><div class="answer">${esc(current.zh)}</div>${selected&&status==='unknown'?`<p class="meta">你的选择：${esc(selected)}</p>`:''}<p class="meta">${status==='unknown'?'已加入生词本，之后可以继续复习。':'已更新学习进度。'}</p></section><button class="primary nextAnswer" onclick="nextQ()">${qIndex+1===queue.length?'完成本轮':'下一题'}</button></div>`;
}
function markUnknown(){recordAnswer("unknown")}
function revealKnown(){app.innerHTML=`${studyBackButton()}<div class="study"><div class="word">${esc(current.en)}</div><div class="answer">${esc(current.zh)}</div><p>和你想的一样吗？</p><div class="bigBtns"><button class="secondary" onclick="confirmKnown(false)">我错了</button><button class="primary" onclick="confirmKnown(true)">我没错</button></div></div>`}
function confirmKnown(ok){recordAnswer(ok?"known":"unknown")}
function nextQ(){qIndex++;showQuestion()}

function showManager(c=currentCourse,w=currentWeek){
 setStudyNav('manager');
 if(!session)return showAuth();if(!Object.keys(COURSES).length)return showCourses();currentCourse=COURSES[c]?c:Object.keys(COURSES)[0];currentWeek=Math.min(Number(w)||1,weekCount(currentCourse));window._view={type:"manager",c:currentCourse,w:currentWeek};
 app.innerHTML=`<div class="sectionHead"><button class="back" onclick="showHome()">← 返回</button><div><h1>词库管理</h1><div class="meta">添加、批量导入或删除词汇</div></div></div>
 <div class="panel">
 <div class="row"><select id="mc">${Object.keys(COURSES).map(x=>`<option value="${x}" ${x===currentCourse?"selected":""}>${esc(courseLabel(x))} · ${esc(COURSES[x])}</option>`).join("")}</select>
 <select id="mw">${Array.from({length:weekCount(currentCourse)},(_,i)=>i+1).map(x=>`<option value="${x}" ${x===currentWeek?"selected":""}>Week ${x}</option>`).join("")}</select></div>
 <h3>单个添加</h3><div class="row"><input id="en" placeholder="English"><input id="zh" placeholder="中文"></div><br><button class="primary" onclick="addOne()">添加单词</button>
 <h3 style="margin-top:30px">批量导入</h3><p class="meta">每行一个词：英文 | 中文，或英文[TAB]中文</p><textarea id="bulk" placeholder="common law | 普通法&#10;case law | 判例法"></textarea><br><br>
 <button class="primary" onclick="bulkImport()">批量导入</button><div id="notice" class="notice"></div>
 <h3 style="margin-top:30px">本周词汇</h3><div id="wordList" class="list"></div></div>`;
 document.getElementById("mc").onchange=e=>{currentCourse=e.target.value;showManager(currentCourse,currentWeek)};
 document.getElementById("mw").onchange=e=>{currentWeek=Number(e.target.value);showManager(currentCourse,currentWeek)};
 renderList();
}
function renderList(){
 const el=document.getElementById("wordList");if(!el)return;
 const arr=words.filter(x=>x.course===currentCourse&&Number(x.week)===Number(currentWeek));
 el.innerHTML=arr.length?arr.map(x=>`<div class="item"><div><b>${esc(x.en)}</b><div class="zh">${esc(x.zh)}</div></div><div><button class="linkbtn" onclick="editWord(${Number(x.id)})">编辑</button><button class="linkbtn danger" onclick="deleteWord(${Number(x.id)})">删除</button></div></div>`).join(""):`<div class="empty">本周还没有词汇</div>`;
}
async function addOne(){
 const en=document.getElementById("en").value.trim(),zh=document.getElementById("zh").value.trim();if(!en||!zh)return notice("请输入英文和中文",true);
 try{await sb("user_vocabulary",{method:"POST",body:JSON.stringify(cloudWord(en,zh))});await loadCloud();renderList();notice("已保存到云端："+en)}
 catch(e){notice("保存失败："+e.message,true)}
}
function cloudWord(en,zh){return {user_id:session.user.id,course_id:currentCourse,week:currentWeek,english:en,chinese:zh,word_type:"Professional term"}}
function parseBulk(raw){
 return raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(line=>{
   let p=line.includes("\t")?line.split("\t"):line.split("|");
   if(p.length<2)return null;
   return {en:p[0].trim(),zh:p.slice(1).join(" ").trim()};
 }).filter(x=>x&&x.en&&x.zh);
}
async function bulkImport(){
 const items=parseBulk(document.getElementById("bulk").value);
 if(!items.length)return notice("没有识别到词汇，请使用 英文 | 中文 或 Tab 分隔。",true);
 const existing=new Set(words.filter(x=>x.course===currentCourse&&Number(x.week)===currentWeek).map(x=>x.en.trim().toLowerCase()));
 const rows=[];let skipped=0;
 for(const x of items){const k=x.en.toLowerCase();if(existing.has(k)){skipped++;continue}existing.add(k);rows.push(cloudWord(x.en,x.zh))}
 if(!rows.length)return notice("没有新增词汇；这些词已经存在。",true);
 try{
   await sb("user_vocabulary",{method:"POST",body:JSON.stringify(rows)});
   await loadCloud();renderList();document.getElementById("bulk").value="";
   notice(`成功导入 ${rows.length} 个词${skipped?`，跳过 ${skipped} 个重复词`:""}。`);
 }catch(e){notice("批量导入失败："+e.message,true)}
}
async function deleteWord(id){
 if(!confirm("确定删除这个词吗？"))return;
 try{await sb("user_vocabulary?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"}});delete progress[id];await loadCloud();renderList();notice("已删除")}
 catch(e){notice("删除失败："+e.message,true)}
}
function notice(t,bad=false){const n=document.getElementById("notice");if(n){n.textContent=t;n.className="notice"+(bad?" danger":"")}}

function showBook(kind){
 if(!session)return showAuth();
 setStudyNav(kind);
 window._view={type:"book",kind};const arr=words.filter(w=>progress[w.id]===kind);
 app.innerHTML=`<div class="sectionHead"><button class="back" onclick="showHome()">← 返回</button><div><h1>${kind==="known"?"熟词本":"生词本"}</h1><div class="meta">${arr.length} words</div></div></div>
 <div class="panel">${arr.length?arr.map(x=>`<div class="item"><div><b>${esc(x.en)}</b><div class="zh">${esc(x.zh)} · ${esc(courseLabel(x.course))} Week ${x.week}</div></div></div>`).join(""):`<div class="empty">暂无词汇</div>`}</div>`;
}
function renderCurrent(){
 const v=window._view||{type:"home"};
 if(v.type==="home")showHome();else if(v.type==="weeks")showWeeks(v.c);else if(v.type==="week")showWeek(v.c,v.w);else if(v.type==="manager")showManager(v.c,v.w);else if(v.type==="book")showBook(v.kind);else if(v.type==="materials")showMaterialsLibrary();else if(v.type==="upload")refreshUploadState();else if(v.type==="courses")showCourses();else if(v.type==="ownAI")showOwnAI(v.c,v.w);else if(v.type==="profile")showProfile(v.required);else showHome();
}
